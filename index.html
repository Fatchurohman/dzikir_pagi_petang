<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark-emerald: #0B2B1B;
            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.6);
            --text-arabic: #FDF0CD;
            --text-latin: #E0EADF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #05140C; font-family: 'Crimson Pro', serif;
        }

        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw; height: 100vh; height: 100dvh;
            padding: 15px 12px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        .app-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(254, 238, 185, 0.3) 50%, transparent 55%);
            transform: rotate(30deg); animation: shimmerEffect 6s infinite linear; pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .corner-ornament {
            position: absolute; width: 26px; height: 26px;
            border: 3px solid var(--gold-glorious); z-index: 2; pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        .header {
            text-align: center; border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 12px; margin-bottom: 8px; position: relative; z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif; font-size: 2rem; color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.85rem; color: var(--gold-primary); font-weight: 600;
            display: flex; justify-content: center; gap: 10px; margin-bottom: 6px;
        }

        .developer-container { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px; }

        .live-indicator {
            width: 7px; height: 7px; background-color: #00FF66; border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4); animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .developer-tag {
            font-size: 0.78rem; font-weight: 700; text-transform: lowercase; letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; z-index: 3; padding: 0 4px; }

        .mode-switcher {
            display: flex; width: 100%; background: rgba(5, 25, 15, 0.6);
            border: 1px solid var(--gold-glorious); border-radius: 6px; padding: 3px; gap: 4px;
        }

        .mode-btn {
            flex: 1; padding: 6px 12px; border: none; background: transparent;
            color: var(--gold-primary); font-family: 'Crimson Pro', serif;
            font-size: 0.9rem; font-weight: 700; border-radius: 4px; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            color: #051A10; box-shadow: 0 2px 5px var(--shadow-color);
        }

        .dzikir-viewport {
            flex-grow: 1; position: relative; overflow-y: auto; z-index: 3;
            padding-right: 4px; display: flex; flex-direction: column; gap: 12px;
        }

        .dzikir-viewport::-webkit-scrollbar { width: 4px; }
        .dzikir-viewport::-webkit-scrollbar-thumb { background: var(--gold-glorious); border-radius: 2px; }

        .dzikir-card {
            background: rgba(5, 25, 15, 0.55); border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 8px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 6px; }
        .dzikir-title { font-size: 0.95rem; font-weight: 700; color: var(--gold-light); display: flex; align-items: center; gap: 6px; }
        .repeat-badge { font-size: 0.75rem; background: rgba(212, 175, 55, 0.15); color: var(--gold-primary); padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.3); font-weight: 700; }
        .arabic-text { font-family: 'Amiri', serif; font-size: 1.7rem; color: var(--text-arabic); text-align: right; line-height: 2.2; direction: rtl; margin: 4px 0; text-shadow: 0 0 2px rgba(0,0,0,0.5); }
        .latin-text { font-size: 0.9rem; color: var(--gold-primary); font-style: italic; line-height: 1.5; text-align: left; margin-bottom: 2px; }
        .translation-text { font-size: 0.92rem; color: var(--text-latin); line-height: 1.5; text-align: left; }
        .benefit-box { background: rgba(11, 43, 27, 0.6); border-left: 3px solid var(--gold-glorious); padding: 6px 10px; font-size: 0.85rem; color: var(--gold-light); border-radius: 0 4px 4px 0; }

        .counter-section {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(3, 15, 9, 0.6); border-radius: 6px; padding: 6px 12px;
            border: 1px solid rgba(212, 175, 55, 0.2); margin-top: 4px;
        }

        .counter-status { font-size: 0.85rem; color: var(--gold-primary); font-weight: 700; }
        .counter-status span { color: var(--gold-light); font-size: 1.1rem; }

        .counter-btn {
            background: linear-gradient(135deg, var(--gold-glorious), var(--gold-dark));
            color: #051A10; border: none; padding: 6px 16px; font-family: 'Crimson Pro', serif;
            font-size: 0.85rem; font-weight: 700; border-radius: 4px; cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color); display: flex; align-items: center; gap: 6px;
        }

        .counter-btn:active { filter: brightness(0.9); }
        .counter-btn.completed { background: #1B4D33; color: var(--gold-light); border: 1px solid var(--gold-glorious); }

        .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; z-index: 3; padding: 0 4px; }
        .btn-reset {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious));
            color: #051A10; border: none; padding: 8px 14px; font-family: 'Crimson Pro', serif;
            font-size: 0.85rem; font-weight: 700; border-radius: 4px; cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color);
        }
    </style>
</head>

            <button class="btn-reset" onclick="resetAllCounters()"><i class="fa-solid fa-rotate-left"></i> Reset Hitungan</button>

            },
            {
                id: 6, title: "Perlindungan Dari Bahaya", icon: "fa-hand-holding-hand", max: 3, mode: "both",
                arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
                latin: "Bismillaahillazii laa yadhurru ma'asmihii syai-un fil-ardhi wa laa fis-samaa-i wa huwas-samii'ul-'aliim.",
                trans: "Dengan nama Allah yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat membahayakan, dan Dia Maha Mendengar lagi Maha Mengetahui.",
                benefit: "Keutamaan: Barangsiapa membacanya 3x saat pagi dan petang, tidak ada bahaya yang akan menimpanya. (HR. Tirmidzi)"
            },
            {
                id: 7, title: "Tasbih 100 Kali", icon: "fa-gem", max: 100, mode: "both",
                arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
                latin: "Subhaanallaahi wa bihamdihii.",
                trans: "Maha Suci Allah dan dengan memuji-Nya.",
                benefit: "Keutamaan: Dihapuskan kesalahan-kesalahannya walau sebanyak buih di lautan. (HR. Bukhari & Muslim)"
            }
        ];

        const counters = {};
        let currentMode = 'pagi';

        function renderDzikir() {
            const viewport = document.getElementById('dzikirViewport');
            viewport.innerHTML = '';

            const filteredData = dzikirData.filter(item => item.mode === 'both' || item.mode === currentMode);

            filteredData.forEach(item => {
                const count = counters[item.id] || 0;
                const isCompleted = count >= item.max;

                const card = document.createElement('div');
                card.className = 'dzikir-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="dzikir-title"><i class="fa-solid ${item.icon}"></i> ${item.title}</div>
                        <div class="repeat-badge">${item.max}x</div>
                    </div>
                    <div class="arabic-text">${item.arabic}</div>
                    <div class="latin-text">"${item.latin}"</div>
                    <div class="translation-text">"${item.trans}"</div>
                    ${item.benefit ? `<div class="benefit-box"><strong>${item.benefit}</strong></div>` : ''}
                    <div class="counter-section">
                        <div class="counter-status">Progres: <span id="count-${item.id}">${count}</span> / ${item.max}</div>
                        <button class="counter-btn ${isCompleted ? 'completed' : ''}" id="btn-${item.id}" onclick="countTap(${item.id}, ${item.max})">
                            <i class="fa-solid ${isCompleted ? 'fa-check' : 'fa-fingerprint'}"></i> ${isCompleted ? 'Selesai' : 'Hitung'}
                        </button>
                    </div>
                `;
                viewport.appendChild(card);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnPagi').classList.toggle('active', mode === 'pagi');
            document.getElementById('btnPetang').classList.toggle('active', mode === 'petang');
            document.getElementById('statusSummary').innerText = `Mode: Dzikir ${mode === 'pagi' ? 'Pagi' : 'Petang'}`;
            if (navigator.vibrate) navigator.vibrate(30);
            renderDzikir();
        }

        function countTap(id, max) {
            if (!counters[id]) counters[id] = 0;
            if (counters[id] < max) {
                counters[id]++;
                if (navigator.vibrate) navigator.vibrate(25);
                document.getElementById(`count-${id}`).innerText = counters[id];
                if (counters[id] === max) {
                    const btn = document.getElementById(`btn-${id}`);
                    btn.classList.add('completed');
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Selesai`;
                    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                }
            }
        }

        function resetAllCounters() {
            dzikirData.forEach(item => { counters[item.id] = 0; });
            if (navigator.vibrate) navigator.vibrate(50);
            renderDzikir();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDzikir();
        });
    </script>
</body>
</html>
