<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dzikir Pagi & Petang Glorious Emerald Edition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark-emerald: #0B2B1B;
            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.7);
            --text-latin: #E0EADF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05140C;
            font-family: 'Crimson Pro', serif;
        }

        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(254, 238, 185, 0.3) 50%, transparent 55%);
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .corner-ornament {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid var(--gold-glorious);
            z-index: 2;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 6px;
            margin-bottom: 6px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 1.7rem;
            color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 10px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.8rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        .developer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
        }

        .live-indicator {
            width: 7px;
            height: 7px;
            background-color: #00FF66;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4);
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .developer-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Panel Kontrol Ramah Lansia */
        .lansia-controls {
            background: rgba(3, 15, 9, 0.8);
            border: 1px solid var(--gold-glorious);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 6px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 700;
        }

        .font-size-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-size {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-glorious);
            color: var(--gold-primary);
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
        }

        .btn-size.active {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious));
            color: #051A10;
        }

        /* Viewport List Dzikir */
        .dzikir-viewport {
            flex-grow: 1;
            position: relative;
            overflow-y: auto;
            z-index: 3;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dzikir-viewport::-webkit-scrollbar {
            width: 5px;
        }
        .dzikir-viewport::-webkit-scrollbar-thumb {
            background: var(--gold-glorious);
            border-radius: 3px;
        }

        .dzikir-card {
            background: rgba(5, 25, 15, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dzikir-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 4px;
        }

        .dzikir-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .dzikir-target {
            font-size: 0.8rem;
            color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--gold-glorious);
            font-weight: 700;
        }

        /* Teks Arab 3D Gold Mewah & Dinamis untuk Lansia */
        .arabic-text {
            font-family: 'Amiri', serif;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF5C0 0%, #F8E49A 30%, #D4AF37 70%, #9A7B1C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.85), 0 0 12px rgba(212, 175, 55, 0.3);
            text-align: right;
            direction: rtl;
            line-height: 2.5;
            letter-spacing: 0.5px;
        }

        /* Ukuran Font Dinamis */
        .size-sedang { font-size: 1.8rem; }
        .size-besar { font-size: 2.2rem; }
        .size-sangat-besar { font-size: 2.8rem; line-height: 2.8; }

        .translation-text {
            font-size: 0.9rem;
            color: var(--text-latin);
            line-height: 1.4;
            text-align: left;
            font-weight: 500;
        }

        .fadhilah-text {
            font-size: 0.82rem;
            color: var(--gold-primary);
            font-style: italic;
            border-left: 2px solid var(--gold-glorious);
            padding-left: 6px;
            margin-top: 4px;
        }

        /* Panel Hitung Interaktif (Counter) yang Mudah Ditekan Lansia */
        .counter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 15, 9, 0.9);
            border: 1px solid var(--gold-glorious);
            border-radius: 6px;
            padding: 6px 10px;
            margin-top: 6px;
        }

        .counter-label {
            font-size: 0.85rem;
            color: var(--gold-light);
            font-weight: 700;
        }

        .counter-btns {
            display: flex;
            gap: 6px;
        }

        .btn-count {
            background: linear-gradient(135deg, var(--gold-glorious), var(--gold-dark));
            color: #051A10;
            border: none;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
        }

        .btn-reset {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #FF6B6B;
            color: #FFB2B2;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-top: 4px;
            z-index: 3;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <header class="header">
            <h1 class="header-title">أذْكَارُ الصَّبَاحِ وَالْمَسَاءِ</h1>
            <div class="header-meta">
                <span>Dzikir Pagi & Petang Pilihan</span>
            </div>
            <div class="developer-container">
                <div class="live-indicator"></div>
                <div class="developer-tag">developer : fatur62</div>
            </div>
        </header>

        <!-- Panel Kontrol Lansia (Ukuran Huruf Saja) -->
        <div class="lansia-controls">
            <div class="control-row">
                <span class="control-label"><i class="fa-solid fa-text-height"></i> Ukuran Huruf:</span>
                <div class="font-size-buttons">
                    <button class="btn-size" onclick="changeFontSize('sedang')">Sedang</button>
                    <button class="btn-size active" onclick="changeFontSize('besar')">Besar</button>
                    <button class="btn-size" onclick="changeFontSize('sangat-besar')">Sangat Besar</button>
                </div>
            </div>
        </div>

        <!-- Viewport List Dzikir -->
        <main class="dzikir-viewport" id="dzikirViewport">
            <!-- Rendered by JS -->
        </main>

        <!-- Footer -->
        <footer class="footer-info">
            <span>Amalan Sunnah Harian Lansia</span>
        </footer>
    </div>

    <script>
        const dzikirData = [
            {
                id: 1,
                title: "1. Membaca Ayat Kursi",
                target: 1,
                arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ ما في السَّمَاوَاتِ وَمَا فِي الْأَرْضِ...",
                trans: "Allah, tidak ada tuhan selain Dia. Yang Maha Hidup, Yang terus menerus mengurus (makhluk-Nya)... (QS. Al-Baqarah: 255)",
                fadhilah: "Barangsiapa membacanya ketika pagi, maka ia dilindungi dari gangguan jin hingga sore hari."
            },
            {
                id: 2,
                title: "2. Membaca Surat Al-Ikhlas, Al-Falaq, & An-Nas",
                target: 3,
                arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِقُلْ هُوَ اللَّهُ أَحَدٌ... قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... قُلْ أَعُوذُ بِرَبِّ النَّاسِ...",
                trans: "Dengan nama Allah Yang Maha Pengasih lagi Maha Penyayang. Katakanlah (Muhammad): 'Dialah Allah Yang Maha Esa'... (Masing-masing dibaca 3 kali)",
                fadhilah: "Cukup baginya perlindungan dari segala sesuatu."
            },
            {
                id: 3,
                title: "3. Sayyidul Istighfar",
                target: 1,
                arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ, خَلَقْتَنِي وَأَنَا عَبْدُكَ...",
                trans: "Ya Allah, Engkau adalah Tuhanku, tidak ada tuhan selain Engkau. Engkau yang menciptakanku dan aku adalah hamba-Mu...",
                fadhilah: "Barangsiapa membacanya di siang hari dengan penuh keyakinan lalu meninggal sebelum sore, ia termasuk penghuni surga."
            },
            {
                id: 4,
                title: "4. Doa Perlindungan Pagi/Petang",
                target: 1,
                arabic: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...",
                trans: "Kami telah memasuki waktu pagi dan kerajaan hanya milik Allah, segala puji bagi Allah, tidak ada tuhan selain Allah Yang Maha Esa, tiada sekutu bagi-Nya.",
                fadhilah: "Memohon keberkahan, keselamatan, dan perlindungan sepanjang hari."
            }
        ];

        let currentFontSize = 'size-besar';
        let counters = {};

        function renderDzikir() {
            const viewport = document.getElementById('dzikirViewport');
            viewport.innerHTML = '';

            dzikirData.forEach(item => {
                if (counters[item.id] === undefined) {
                    counters[item.id] = 0;
                }

                const card = document.createElement('div');
                card.className = 'dzikir-card';
                card.innerHTML = `
                    <div class="dzikir-header-info">
                        <span class="dzikir-title">${item.title}</span>
                        <span class="dzikir-target">Target: ${item.target}x</span>
                    </div>
                    <div class="arabic-text ${currentFontSize}">${item.arabic}</div>
                    <div class="translation-text">${item.trans}</div>
                    <div class="fadhilah-text">${item.fadhilah}</div>
                    <div class="counter-container">
                        <span class="counter-label" id="count-label-${item.id}">Terhitung: <b>${counters[item.id]}</b> / ${item.target}</span>
                        <div class="counter-btns">
                            <button class="btn-count" onclick="incrementCounter(${item.id}, ${item.target})">Hitung (+1)</button>
                            <button class="btn-reset" onclick="resetCounter(${item.id})">Ulang</button>
                        </div>
                    </div>
                `;
                viewport.appendChild(card);
            });
        }

        function incrementCounter(id, target) {
            if (counters[id] < target) {
                counters[id]++;
                document.getElementById(`count-label-${id}`).innerHTML = `Terhitung: <b>${counters[id]}</b> / ${target}`;
            } else {
                counters[id] = 0; // Reset atau putar ulang jika sudah tercapai
                document.getElementById(`count-label-${id}`).innerHTML = `Terhitung: <b>${counters[id]}</b> / ${target}`;
            }
        }

        function resetCounter(id) {
            counters[id] = 0;
            const target = dzikirData.find(d => d.id === id).target;
            document.getElementById(`count-label-${id}`).innerHTML = `Terhitung: <b>0</b> / ${target}`;
        }

        function changeFontSize(size) {
            currentFontSize = size === 'sedang' ? 'size-sedang' : (size === 'sangat-besar' ? 'size-sangat-besar' : 'size-besar');
            
            document.querySelectorAll('.btn-size').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.arabic-text').forEach(el => {
                el.className = `arabic-text ${currentFontSize}`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDzikir();
        });
    </script>
</body>
</html>
